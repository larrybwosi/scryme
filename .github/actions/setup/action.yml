name: setup
description: Install the pinned toolchain and mock configuration on an already checked out workspace
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Install mock configuration
      run: cp .env.ci.mock .env
      shell: bash
