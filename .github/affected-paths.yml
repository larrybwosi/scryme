{
  "paths": [
    {
      "pattern": "apps/android/**",
      "regex": "^apps/android/",
      "workspaces": ["android"]
    },
    {
      "pattern": "apps/pos/src-tauri/**",
      "regex": "^apps/pos/src-tauri/",
      "workspaces": ["pos"]
    },
    {
      "pattern": "apps/bakery/src-tauri/**",
      "regex": "^apps/bakery/src-tauri/",
      "workspaces": ["bakery"]
    },
    {
      "pattern": "docker/**",
      "regex": "^docker/",
      "workspaces": ["api", "admin", "crm", "cms", "web", "projects", "site-next", "auth", "docs"]
    },
    {
      "pattern": "docs/**",
      "regex": "^docs/",
      "workspaces": ["docs"]
    },
    {
      "pattern": "skills/**",
      "regex": "^skills/",
      "workspaces": ["docs"]
    }
  ]
}
