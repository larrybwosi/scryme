name: affected

on:
  workflow_call:
    inputs:
      base:
        description: Base ref for affected detection
        required: false
        type: string
        default: ''
      head:
        description: Head ref for affected detection
        required: false
        type: string
        default: ''
    outputs:
      workspaces:
        description: Changed workspaces plus their dependants
        value: ${{ jobs.affected.outputs.workspaces }}
      docs_only:
        description: Whether the change is limited to docs and skills
        value: ${{ jobs.affected.outputs.docs_only }}

permissions:
  contents: read

jobs:
  affected:
    name: affected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.manual.outputs.workspaces }}
      docs_only: ${{ steps.manual.outputs.docs_only }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Query the Turbo graph
        id: graph
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base_ref="${BASE:-${PR_BASE_SHA:-${PUSH_BEFORE:-HEAD~1}}}"
          head_ref="${HEAD:-HEAD}"
          pnpm turbo query affected --packages --base "$base_ref" --head "$head_ref" | awk '/^\{$/{f=1} f' > affected.json
          echo "workspaces=$(jq -c '[.data.affectedPackages.items[].name | select(. != "//")]' affected.json)" >> "$GITHUB_OUTPUT"
          git diff --name-only "$base_ref" "$head_ref" > changed-files.txt || true

      - name: Add paths Turbo cannot derive
        id: manual
        env:
          WORKSPACES: ${{ steps.graph.outputs.workspaces }}
        run: |
          workspaces="$WORKSPACES"
          while IFS=$'\t' read -r regex names; do
            if grep -qE "$regex" changed-files.txt; then
              for name in $(echo "$names" | tr ',' ' '); do
                workspaces="$(jq -c --arg name "$name" 'if index($name) then . else . + [$name] end' <<< "$workspaces")"
              done
            fi
          done < <(jq -r '.paths[] | [.regex, (.workspaces | join(","))] | @tsv' .github/affected-paths.yml)
          echo "workspaces=$workspaces" >> "$GITHUB_OUTPUT"
          if [ -s changed-files.txt ] && ! grep -qvE '^(docs/|skills/)' changed-files.txt; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
