name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment, staging or production
        required: true
        type: string
      digest:
        description: Immutable api image digest to promote
        required: true
        type: string
      report:
        description: JSON object of image name to digest from the build
        required: false
        type: string
        default: ''
      version:
        description: Version being deployed
        required: false
        type: string
        default: ''
      health_url:
        description: URL that must return success before the deployment closes
        required: true
        type: string
      rollback:
        description: Whether this run is a rollback to the previous digest
        required: false
        type: boolean
        default: false
    outputs:
      active_digest:
        description: Digest confirmed active after the health gate
        value: ${{ jobs.deploy.outputs.active_digest }}

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    outputs:
      active_digest: ${{ steps.confirm.outputs.active_digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the exact digests
        env:
          DIGEST: ${{ inputs.digest }}
          REPORT: ${{ inputs.report }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "No digest supplied, refusing to deploy"
            exit 1
          fi
          repo="ghcr.io/larrybwosi/scryme"
          if [ -n "$REPORT" ]; then
            echo "$REPORT" | jq -r 'to_entries[] | "\(.key) \(.value)"' |
              while IFS=' ' read -r key image_digest; do
                if [ -z "$key" ] || [ -z "$image_digest" ]; then
                  continue
                fi
                name="${key#digest-}"
                docker pull "$repo/$name@$image_digest"
                docker tag "$repo/$name@$image_digest" "scryme-$name:latest"
              done
          else
            docker pull "$repo/api@$DIGEST"
            docker tag "$repo/api@$DIGEST" scryme-api:latest
          fi

      - name: Promote the pulled images
        env:
          SKIP_MIGRATIONS: 'true'
        run: docker compose -f docker-compose.prod.yml up -d --remove-orphans --no-build

      - name: Wait for health
        env:
          HEALTH_URL: ${{ inputs.health_url }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$HEALTH_URL" > /dev/null; then
              echo "Health passed on attempt $attempt"
              exit 0
            fi
            echo "Health not ready on attempt $attempt"
            sleep 10
          done
          echo "Health gate failed for ${{ inputs.environment }}"
          exit 1

      - name: Record deployment digests
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DIGEST: ${{ inputs.digest }}
        run: |
          image="ghcr.io/larrybwosi/scryme/api"
          if docker pull "$image:deployed-$ENVIRONMENT" > /dev/null 2>&1; then
            previous="$(docker image inspect "$image:deployed-$ENVIRONMENT" --format '{{index .RepoDigests 0}}' | cut -d '@' -f 2)"
            if [ -n "$previous" ]; then
              docker tag "$image@$previous" "$image:deployed-$ENVIRONMENT-previous"
              docker push "$image:deployed-$ENVIRONMENT-previous"
            fi
          fi
          docker tag "$image@$DIGEST" "$image:deployed-$ENVIRONMENT"
          docker push "$image:deployed-$ENVIRONMENT"

      - name: Confirm active digest
        id: confirm
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          active="$(docker image inspect ghcr.io/larrybwosi/scryme/api@${DIGEST} --format '{{index .RepoDigests 0}}' | cut -d '@' -f 2)"
          if [ "$active" != "$DIGEST" ]; then
            echo "Active digest $active does not match requested $DIGEST"
            exit 1
          fi
          echo "active_digest=$active" >> "$GITHUB_OUTPUT"
          echo "environment=${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "version=${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$active" >> "$GITHUB_STEP_SUMMARY"
          echo "rollback=${{ inputs.rollback }}" >> "$GITHUB_STEP_SUMMARY"
