name: Android Prerelease
on:
  push:
    branches:
      - android
permissions:
  contents: write
jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./apps/pos/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  check-changesets:
    name: Check for Pending Changesets
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.check.outputs.hasChangesets }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Check for pending changesets
        id: check
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "hasChangesets=true" >> $GITHUB_OUTPUT
          else
            echo "hasChangesets=false" >> $GITHUB_OUTPUT
          fi

  build-and-prerelease:
    name: Build & Prerelease Android App (v${{ needs.get-version.outputs.version }})
    runs-on: ubuntu-latest
    needs: [get-version, check-changesets]
    if: needs.check-changesets.outputs.hasChangesets == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Android Release APK
        run: |
          cd apps/android
          gradle assembleRelease --no-daemon
      - name: Prepare APK Asset
        id: prepare-apk
        run: |
          # Locate the built APK
          APK_PATH=$(find apps/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          # Copy to a clean, descriptive name that includes app name + version
          cp "$APK_PATH" scryme-admin-v${{ needs.get-version.outputs.version }}.apk
          echo "apk_path=scryme-admin-v${{ needs.get-version.outputs.version }}.apk" >> $GITHUB_OUTPUT
      - name: Create GitHub Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scryme-admin-v${{ needs.get-version.outputs.version }}
          name: "scryme-admin v${{ needs.get-version.outputs.version }} (Prerelease)"
          body: "Automated Android prerelease build from branch `android` (v${{ needs.get-version.outputs.version }})."
          draft: false
          prerelease: true
          files: |
            scryme-admin-v${{ needs.get-version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
