name: Android Prerelease

on:
  push:
    branches:
      - android

permissions:
  contents: write

jobs:
  build-and-prerelease:
    name: Build & Prerelease Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd apps/android
          gradle assembleRelease --no-daemon

      - name: Prepare APK Asset
        id: prepare-apk
        run: |
          # Locate the built APK
          APK_PATH=$(find apps/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          # Copy to a clean, descriptive name
          cp "$APK_PATH" scryme-admin-prerelease.apk
          echo "apk_path=scryme-admin-prerelease.apk" >> $GITHUB_OUTPUT

      - name: Get current date for Tag
        id: date-tag
        run: |
          TAG_DATE=$(date +'%Y.%m.%d-%H%M')
          echo "tag=android-v$TAG_DATE" >> $GITHUB_OUTPUT

      - name: Create GitHub Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date-tag.outputs.tag }}
          name: "Android Prerelease ${{ steps.date-tag.outputs.tag }}"
          body: "Automated Android prerelease build from branch `android`."
          draft: false
          prerelease: true
          files: |
            scryme-admin-prerelease.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
