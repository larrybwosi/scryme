name: Test

on:
  pull_request:
    branches: [main, dev, nextgen]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  affected:
    uses: ./.github/workflows/affected.yml

  lint:
    name: lint
    needs: affected
    uses: ./.github/workflows/checks.yml
    with:
      workspaces: ${{ needs.affected.outputs.workspaces }}
      layer: lint

  unit:
    name: unit
    needs: affected
    uses: ./.github/workflows/checks.yml
    with:
      workspaces: ${{ needs.affected.outputs.workspaces }}
      layer: unit

  integration:
    name: integration
    needs: affected
    uses: ./.github/workflows/checks.yml
    with:
      workspaces: ${{ needs.affected.outputs.workspaces }}
      layer: integration

  native_checks:
    name: native checks
    needs: affected
    uses: ./.github/workflows/checks.yml
    with:
      workspaces: ${{ needs.affected.outputs.workspaces }}
      layer: native

  docs_metadata:
    name: docs metadata
    needs: affected
    uses: ./.github/workflows/checks.yml
    with:
      workspaces: ${{ needs.affected.outputs.workspaces }}
      layer: docs
      docs_only: ${{ needs.affected.outputs.docs_only }}

  verify_build:
    name: verify build
    needs: [affected, lint, unit, integration, native_checks, docs_metadata]
    uses: ./.github/workflows/build.yml
    with:
      mode: verify
      workspaces: ${{ needs.affected.outputs.workspaces }}
