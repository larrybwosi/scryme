name: build

on:
  workflow_call:
    inputs:
      mode:
        description: verify, e2e or artifact
        required: true
        type: string
      workspaces:
        description: JSON array of affected workspace names
        required: false
        type: string
        default: '[]'
      version:
        description: Version produced by ensure-unique-version.js
        required: false
        type: string
        default: ''
      commit_sha:
        description: Commit SHA the release is built from
        required: false
        type: string
        default: ''
    outputs:
      digest:
        description: Digest of the api image promoted by the release
        value: ${{ jobs.digests.outputs.digest }}
      version:
        description: Version passed to the build
        value: ${{ jobs.digests.outputs.version }}
      report:
        description: JSON object of image name to digest
        value: ${{ jobs.digests.outputs.report }}

jobs:
  validate:
    name: validate release inputs
    if: inputs.mode == 'artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require version and commit
        run: |
          if [ -z "${{ inputs.version }}" ]; then
            echo "Artifact builds require a version"
            exit 1
          fi
          if [ -z "${{ inputs.commit_sha }}" ]; then
            echo "Artifact builds require a commit SHA"
            exit 1
          fi

  verify_build:
    name: verify build
    if: inputs.mode == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
      - name: Verify affected workspaces compile
        env:
          WORKSPACES: ${{ inputs.workspaces }}
        run: |
          count="$(echo "$WORKSPACES" | jq length)"
          if [ "$count" -eq 0 ]; then
            echo "No code workspaces affected, verify build passed"
            exit 0
          fi
          for ws in $(echo "$WORKSPACES" | jq -r '.[]'); do
            if [ "$ws" = "android" ]; then
              echo "Native workspace android is checked by native checks"
              continue
            fi
            pnpm turbo run build --filter="$ws"
          done

  test_e2e:
    name: test e2e
    if: inputs.mode == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install browsers
        run: pnpm --filter pos exec playwright install --with-deps
      - name: Run Playwright with two workers
        env:
          PLAYWRIGHT_WORKERS: 2
          POSTHOG_API_KEY: mock
          SENTRY_DSN: ''
        run: pnpm turbo run build --filter=pos... && pnpm --filter pos test:e2e -- --workers=2

  images:
    name: build images
    if: inputs.mode == 'artifact'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: admin
            dockerfile: apps/admin/Dockerfile
          - name: crm
            dockerfile: apps/crm/Dockerfile
          - name: cms
            dockerfile: apps/cms/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: projects
            dockerfile: apps/projects/Dockerfile
          - name: site
            dockerfile: apps/site-next/Dockerfile
          - name: auth
            dockerfile: apps/auth/Dockerfile
          - name: docs
            dockerfile: apps/docs/Dockerfile
          - name: prisma-studio
            dockerfile: docker/studio/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image once
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ghcr.io/larrybwosi/scryme/${{ matrix.name }}:${{ inputs.version }}
            ghcr.io/larrybwosi/scryme/${{ matrix.name }}:sha-${{ inputs.commit_sha }}
          build-args: |
            VERSION=${{ inputs.version }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
      - name: Record digest
        run: |
          digest="${{ steps.image.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "Image build produced no digest, failing before promotion"
            exit 1
          fi
          echo "$digest" > digest-${{ matrix.name }}.txt
      - name: Upload digest record
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}-${{ inputs.version }}
          path: digest-${{ matrix.name }}.txt
          if-no-files-found: error
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/larrybwosi/scryme/${{ matrix.name }}:${{ inputs.version }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  digests:
    name: collect digests
    if: inputs.mode == 'artifact'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.result.outputs.digest }}
      version: ${{ steps.result.outputs.version }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*-${{ inputs.version }}
          path: digests
          merge-multiple: true
      - name: Verify every image has a digest
        id: result
        run: |
          report="{}"
          for file in digests/digest-*.txt; do
            name="$(basename "$file" .txt)"
            digest="$(tr -d '[:space:]' < "$file")"
            if [ -z "$digest" ]; then
              echo "$name has no digest"
              exit 1
            fi
            report="$(jq -c --arg name "$name" --arg digest "$digest" '.[$name] = $digest' <<< "$report")"
          done
          api_digest="$(jq -r '."digest-api"' <<< "$report")"
          if [ -z "$api_digest" ] || [ "$api_digest" = "null" ]; then
            echo "api digest missing, failing before promotion"
            exit 1
          fi
          echo "digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "report=$(jq -c . <<< "$report")" >> "$GITHUB_OUTPUT"

  pos_bundle:
    name: build pos bundles
    if: inputs.mode == 'artifact'
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [pharmacy, retail, supermarket, restaurant]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/pos/src-tauri/target
          key: ${{ runner.os }}-rust-build-pos-${{ hashFiles('apps/pos/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-build-pos-
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev libudev-dev libpcsclite-dev pkg-config
      - name: Build variant
        env:
          VITE_BUSINESS_MODE: ${{ matrix.variant }}
        run: |
          bash scripts/sync-tauri-version.sh "${{ inputs.version }}"
          pnpm --filter pos build:${{ matrix.variant }}
      - name: Write provenance
        run: |
          name="pos-${{ matrix.variant }}-${{ inputs.version }}-${{ inputs.commit_sha }}"
          digest="$(find apps/pos/src-tauri/target/release/bundle -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          printf '{"name":"%s","version":"%s","commitSha":"%s","digest":"sha256:%s"}\n' "$name" "${{ inputs.version }}" "${{ inputs.commit_sha }}" "$digest" > "$name.provenance.json"
          sha256sum "$name.provenance.json" > "$name.provenance.json.sha256"
      - name: Upload bundle with provenance
        uses: actions/upload-artifact@v4
        with:
          name: pos-${{ matrix.variant }}-${{ inputs.version }}-${{ inputs.commit_sha }}
          path: |
            apps/pos/src-tauri/target/release/bundle/**
            pos-${{ matrix.variant }}-${{ inputs.version }}-${{ inputs.commit_sha }}.provenance.json
            pos-${{ matrix.variant }}-${{ inputs.version }}-${{ inputs.commit_sha }}.provenance.json.sha256
          if-no-files-found: error
      - uses: actions/attest@v4
        with:
          subject-path: pos-${{ matrix.variant }}-${{ inputs.version }}-${{ inputs.commit_sha }}.provenance.json

  bakery_bundle:
    name: build bakery bundle
    if: inputs.mode == 'artifact'
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/bakery/src-tauri/target
          key: ${{ runner.os }}-rust-build-bakery-${{ hashFiles('apps/bakery/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-build-bakery-
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev libudev-dev libpcsclite-dev pkg-config
      - name: Build bakery desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_BUSINESS_MODE: bakery
        with:
          projectPath: ./apps/bakery
          tagName: v${{ inputs.version }}
          releaseName: v${{ inputs.version }}
          releaseDraft: true
          args: --target x86_64-unknown-linux-gnu
      - name: Write provenance
        run: |
          name="bakery-${{ inputs.version }}-${{ inputs.commit_sha }}"
          digest="$(find apps/bakery/src-tauri/target/release/bundle -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          printf '{"name":"%s","version":"%s","commitSha":"%s","digest":"sha256:%s"}\n' "$name" "${{ inputs.version }}" "${{ inputs.commit_sha }}" "$digest" > "$name.provenance.json"
          sha256sum "$name.provenance.json" > "$name.provenance.json.sha256"
      - name: Upload bundle with provenance
        uses: actions/upload-artifact@v4
        with:
          name: bakery-${{ inputs.version }}-${{ inputs.commit_sha }}
          path: |
            apps/bakery/src-tauri/target/release/bundle/**
            bakery-${{ inputs.version }}-${{ inputs.commit_sha }}.provenance.json
            bakery-${{ inputs.version }}-${{ inputs.commit_sha }}.provenance.json.sha256
          if-no-files-found: error
      - uses: actions/attest@v4
        with:
          subject-path: bakery-${{ inputs.version }}-${{ inputs.commit_sha }}.provenance.json

  android_bundle:
    name: build android bundle
    if: inputs.mode == 'artifact'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed release
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bash scripts/sync-tauri-version.sh "${{ inputs.version }}"
          chmod +x apps/android/gradlew
          (cd apps/android && ./gradlew assembleRelease bundleRelease)
      - name: Write provenance
        run: |
          name="scryme-android-${{ inputs.version }}-${{ inputs.commit_sha }}"
          digest="$(find apps/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          printf '{"name":"%s","version":"%s","commitSha":"%s","digest":"sha256:%s"}\n' "$name" "${{ inputs.version }}" "${{ inputs.commit_sha }}" "$digest" > "$name.provenance.json"
          sha256sum "$name.provenance.json" > "$name.provenance.json.sha256"
      - name: Upload bundle with provenance
        uses: actions/upload-artifact@v4
        with:
          name: scryme-android-${{ inputs.version }}-${{ inputs.commit_sha }}
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
            scryme-android-${{ inputs.version }}-${{ inputs.commit_sha }}.provenance.json
            scryme-android-${{ inputs.version }}-${{ inputs.commit_sha }}.provenance.json.sha256
          if-no-files-found: error
      - uses: actions/attest@v4
        with:
          subject-path: scryme-android-${{ inputs.version }}-${{ inputs.commit_sha }}.provenance.json
