name: Release and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to retry
        required: false
        type: string
      rollback_to:
        description: Set to previous to roll back production
        required: false
        type: string
      rollback_digest:
        description: Previous digest to redeploy during a rollback
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  affected:
    uses: ./.github/workflows/affected.yml

  release_lint:
    name: release lint
    needs: affected
    uses: ./.github/workflows/checks.yml
    with:
      workspaces: ${{ needs.affected.outputs.workspaces }}
      layer: lint

  release_unit:
    name: release unit
    needs: affected
    uses: ./.github/workflows/checks.yml
    with:
      workspaces: ${{ needs.affected.outputs.workspaces }}
      layer: unit

  release_integration:
    name: release integration
    needs: affected
    uses: ./.github/workflows/checks.yml
    with:
      workspaces: ${{ needs.affected.outputs.workspaces }}
      layer: integration

  release_native_checks:
    name: release native checks
    needs: affected
    uses: ./.github/workflows/checks.yml
    with:
      workspaces: ${{ needs.affected.outputs.workspaces }}
      layer: native

  release_verify_build:
    name: release verify build
    needs: [affected, release_lint, release_unit]
    uses: ./.github/workflows/build.yml
    with:
      mode: verify
      workspaces: ${{ needs.affected.outputs.workspaces }}

  test_e2e:
    name: test e2e
    needs: [affected, release_verify_build]
    uses: ./.github/workflows/build.yml
    with:
      mode: e2e

  ci_success:
    name: ci success
    needs:
      [
        release_lint,
        release_unit,
        release_integration,
        release_native_checks,
        release_verify_build,
        test_e2e,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    steps:
      - name: Record gate result
        id: result
        run: |
          echo "passed=true" >> "$GITHUB_OUTPUT"
          echo "All required checks passed for ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  version:
    name: version
    needs: ci_success
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      release: ${{ steps.changesets.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Detect version commit
        id: changesets
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then
            echo "Push has no usable base commit, no release is started"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          removed="$(git diff --diff-filter=D --name-only "$BEFORE" HEAD -- .changeset | grep -E '\.md$' | grep -vc 'README.md' || true)"
          manifests="$(git diff --name-only "$BEFORE" HEAD -- package.json apps/*/package.json packages/*/package.json | wc -l)"
          if [ "${removed:-0}" -gt 0 ] && [ "$manifests" -gt 0 ]; then
            echo "Version commit detected from consumed changesets and updated manifests"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Changesets version commit in this push"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Produce unique version
        id: release_version
        if: steps.changesets.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm version-packages || true
          node scripts/ensure-unique-version.js

  build:
    name: build artifacts
    needs: [ci_success, version]
    if: (needs.version.outputs.release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && github.event.inputs.rollback_to != 'previous'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      mode: artifact
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.version.outputs.version }}
      commit_sha: ${{ github.sha }}

  provenance_check:
    name: provenance check
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*-${{ needs.build.outputs.version }}
          path: digests
          merge-multiple: true
      - name: Verify image digests and attestations
        id: verify
        run: |
          count="$(find digests -name 'digest-*.txt' | wc -l)"
          if [ "$count" -lt 10 ]; then
            echo "Expected ten image digests, found $count"
            exit 1
          fi
          digest="$(tr -d '[:space:]' < digests/digest-api.txt)"
          gh attestation verify "oci://ghcr.io/larrybwosi/scryme/api@${digest}" --repo "${{ github.repository }}"
          echo "passed=true" >> "$GITHUB_OUTPUT"
          echo "Verified $count image digests and the api provenance attestation" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: release
    needs: [ci_success, provenance_check, version]
    if: needs.ci_success.outputs.passed == 'true' && needs.provenance_check.outputs.passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create tag before publish
        run: |
          tag="v${VERSION}"
          if git rev-parse "$tag" > /dev/null 2>&1; then
            echo "Tag $tag already exists"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag "$tag"
            git push origin "$tag"
          fi
      - name: Publish packages
        run: |
          if ! pnpm release; then
            gh release edit "v${VERSION}" --notes "publish failed" || true
            exit 1
          fi
      - name: Write promotion record
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          REPORT: ${{ needs.build.outputs.report }}
        run: |
          gh release edit "v${VERSION}" --notes "version ${VERSION}
          commit ${{ github.sha }}
          digest ${DIGEST}
          digests ${REPORT}
          approver required for production
          health pending"
          echo "version=${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  deploy_staging:
    name: deploy staging
    needs: [release, build]
    if: github.event.inputs.rollback_to != 'previous' && needs.build.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: staging
      digest: ${{ needs.build.outputs.digest }}
      report: ${{ needs.build.outputs.report }}
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.version.outputs.version }}
      health_url: ${{ vars.STAGING_HEALTH_URL || 'http://localhost:3005/api/health' }}

  deploy_production:
    name: deploy production
    needs: [deploy_staging, build]
    if: github.event.inputs.rollback_to != 'previous' && needs.build.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      digest: ${{ needs.build.outputs.digest }}
      report: ${{ needs.build.outputs.report }}
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.version.outputs.version }}
      health_url: ${{ vars.PRODUCTION_HEALTH_URL || 'http://localhost:3006/api/health' }}

  previous_digest:
    name: previous production digest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_to == 'previous'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve previous digest
        id: resolve
        env:
          OVERRIDE: ${{ inputs.rollback_digest }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "Using the supplied rollback digest"
            echo "digest=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="ghcr.io/larrybwosi/scryme/api:deployed-production-previous"
          docker pull "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d '@' -f 2)"
          if [ -z "$digest" ]; then
            echo "No previous production digest was recorded, supply rollback_digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Resolve previous digest report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE: ${{ inputs.rollback_digest }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "Using a supplied digest, keeping the existing images for other services"
            echo "report=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_tag="$(gh release list --limit 2 --json tagName --jq '.[1].tagName')"
          body="$(gh release view "$previous_tag" --json body --jq .body)"
          report="$(echo "$body" | sed -n 's/^digests //p' | head -n 1)"
          if [ -z "$report" ]; then
            echo "No digest report found on $previous_tag, rolling back the api only"
            echo "report=" >> "$GITHUB_OUTPUT"
          else
            echo "report=$(echo "$report" | jq -c .)" >> "$GITHUB_OUTPUT"
          fi

  rollback:
    name: rollback production
    needs: previous_digest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_to == 'previous'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      digest: ${{ needs.previous_digest.outputs.digest }}
      report: ${{ needs.previous_digest.outputs.report }}
      version: ${{ inputs.version }}
      rollback: true
      health_url: ${{ vars.PRODUCTION_HEALTH_URL || 'http://localhost:3006/api/health' }}

  rollback_record:
    name: record rollback
    needs: rollback
    if: needs.rollback.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Append rollback to release notes
        env:
          DIGEST: ${{ needs.rollback.outputs.active_digest }}
        run: |
          tag="$(gh release view --json tagName --jq .tagName)"
          body="$(gh release view "$tag" --json body --jq .body)"
          gh release edit "$tag" --notes "${body}

          rolled back to digest ${DIGEST}"
          echo "Rollback recorded on $tag" >> "$GITHUB_STEP_SUMMARY"
