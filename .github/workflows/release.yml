name: Release and Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-management:
    name: Release Management
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.determine-published.outputs.published }}
      hasChangesets: ${{ steps.check-changesets.outputs.hasChangesets }}
      isPrerelease: 'false'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check for Pending Changesets
        id: check-changesets
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "hasChangesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasChangesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "Version Packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Determine Published Status
        id: determine-published
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif echo "$COMMIT_MSG" | grep -qE "chore\(release\): version packages|Version Packages"; then
            if [ "${{ steps.check-changesets.outputs.hasChangesets }}" = "false" ]; then
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "published=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [release-management, set-version]
    if: needs.release-management.outputs.published == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Packages
        run: pnpm turbo build --filter="./packages/*"

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-packages
          path: packages/

  set-version:
    name: Set Version Output
    runs-on: ubuntu-latest
    needs: release-management
    if: needs.release-management.outputs.published == 'true'
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      was_bumped: ${{ steps.get-version.outputs.was_bumped }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Ensure Unique Version and Sync
        id: get-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ensure-unique-version.js

      - name: Commit and Push Version Bump If Needed
        if: steps.get-version.outputs.was_bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(release): bump version to v${{ steps.get-version.outputs.version }}"
          git push origin ${{ github.ref_name }}

  publish-pos:
    name: Publish POS (${{ matrix.os }} - ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    needs: [release-management, set-version, build-packages]
    if: needs.release-management.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        variant: [pharmacy, retail, standalone, supermarket, restaurant]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: built-packages
          path: packages

      - name: Set OS specific args
        id: target
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "args=--target x86_64-pc-windows-msvc" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "args=--target x86_64-apple-darwin" >> $GITHUB_OUTPUT
          else
            echo "args=--target x86_64-unknown-linux-gnu" >> $GITHUB_OUTPUT
          fi

      - name: Sync Version
        run: bash scripts/sync-tauri-version.sh "${{ needs.set-version.outputs.version }}"

      - name: Build and Publish POS App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'secret' }}
          VITE_BUSINESS_MODE: ${{ matrix.variant }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.VITE_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN || secrets.NEXT_PUBLIC_SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY || secrets.NEXT_PUBLIC_POSTHOG_KEY || secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY || secrets.POSTHOG_API_KEY || secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST || secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          OPENPANEL_CLIENT_ID: ${{ secrets.OPENPANEL_CLIENT_ID || secrets.NEXT_PUBLIC_OPENPANEL_CLIENT_ID || secrets.VITE_OPENPANEL_CLIENT_ID }}
          VITE_OPENPANEL_CLIENT_ID: ${{ secrets.VITE_OPENPANEL_CLIENT_ID || secrets.OPENPANEL_CLIENT_ID || secrets.NEXT_PUBLIC_OPENPANEL_CLIENT_ID }}
          VITE_OPENPANEL_HOST: ${{ secrets.VITE_OPENPANEL_HOST || secrets.NEXT_PUBLIC_OPENPANEL_HOST || secrets.OPENPANEL_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.POS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.POS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./apps/pos
          tagName: v${{ needs.set-version.outputs.version }}
          releaseName: "v${{ needs.set-version.outputs.version }}"
          releaseBody: "Release v${{ needs.set-version.outputs.version }}"
          releaseDraft: true
          prerelease: ${{ needs.release-management.outputs.isPrerelease }}
          args: ${{ steps.target.outputs.args }} --config src-tauri/tauri.${{ matrix.variant }}.conf.json --features ${{ matrix.variant }}

  publish-bakery:
    name: Publish Bakery (windows-latest)
    runs-on: windows-latest
    needs: [release-management, set-version, build-packages]
    if: needs.release-management.outputs.published == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: built-packages
          path: packages

      - name: Set OS specific args
        id: target
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "args=--target x86_64-pc-windows-msvc" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "args=--target x86_64-apple-darwin" >> $GITHUB_OUTPUT
          else
            echo "args=--target x86_64-unknown-linux-gnu" >> $GITHUB_OUTPUT
          fi

      - name: Sync Version
        run: bash scripts/sync-tauri-version.sh "${{ needs.set-version.outputs.version }}"

      - name: Build and Publish Bakery App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'secret' }}
          VITE_BUSINESS_MODE: bakery
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.VITE_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN || secrets.NEXT_PUBLIC_SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY || secrets.NEXT_PUBLIC_POSTHOG_KEY || secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY || secrets.POSTHOG_API_KEY || secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST || secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          OPENPANEL_CLIENT_ID: ${{ secrets.OPENPANEL_CLIENT_ID || secrets.NEXT_PUBLIC_OPENPANEL_CLIENT_ID || secrets.VITE_OPENPANEL_CLIENT_ID }}
          VITE_OPENPANEL_CLIENT_ID: ${{ secrets.VITE_OPENPANEL_CLIENT_ID || secrets.OPENPANEL_CLIENT_ID || secrets.NEXT_PUBLIC_OPENPANEL_CLIENT_ID }}
          VITE_OPENPANEL_HOST: ${{ secrets.VITE_OPENPANEL_HOST || secrets.NEXT_PUBLIC_OPENPANEL_HOST || secrets.OPENPANEL_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.POS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.POS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./apps/bakery
          tagName: v${{ needs.set-version.outputs.version }}
          releaseName: "v${{ needs.set-version.outputs.version }}"
          releaseBody: "Release v${{ needs.set-version.outputs.version }}"
          releaseDraft: true
          prerelease: ${{ needs.release-management.outputs.isPrerelease }}
          args: ${{ steps.target.outputs.args }}

  publish-android:
    name: Publish Android App
    runs-on: ubuntu-latest
    needs: [release-management, set-version]
    if: needs.release-management.outputs.published == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync Version
        run: bash scripts/sync-tauri-version.sh "${{ needs.set-version.outputs.version }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: apps/android

      - name: Build Release APK and Bundle
        run: ./gradlew assembleRelease bundleRelease
        working-directory: apps/android

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-builds
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab

      - name: Attach Android Build Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ needs.set-version.outputs.version }}
        run: |
          APK_PATH=$(find apps/android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          AAB_PATH=$(find apps/android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)

          if [ -n "$APK_PATH" ]; then
            gh release upload "$TAG_NAME" "$APK_PATH#scryme-android-${TAG_NAME}.apk" --clobber || echo "No existing release found yet for gh release upload"
          fi
          if [ -n "$AAB_PATH" ]; then
            gh release upload "$TAG_NAME" "$AAB_PATH#scryme-android-${TAG_NAME}.aab" --clobber || echo "No existing release found yet for gh release upload"
          fi

  publish-crates:
    name: Publish Rust SDK to Crates.io
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [release-management, build-packages]
    if: needs.release-management.outputs.published == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Java (Required for openapi-generator-cli)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: built-packages
          path: packages

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Version
        run: bash scripts/sync-tauri-version.sh "${{ needs.set-version.outputs.version }}"

      - name: Generate Rust SDK
        run: pnpm --filter @scryme/sdk generate:rust

      - name: Publish to Crates.io
        continue-on-error: true
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} ${{ needs.release-management.outputs.isPrerelease == 'true' && '--allow-dirty' || '' }}
        working-directory: packages/sdk/rust

  publish-docker:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [release-management, set-version]
    if: needs.release-management.outputs.published == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync Version
        run: bash scripts/sync-tauri-version.sh "${{ needs.set-version.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          push: true
        env:
          VERSION: ${{ needs.set-version.outputs.version }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'secret' }}

  create-tag:
    name: Create Tag and Publish Release
    runs-on: ubuntu-latest
    needs: [release-management, set-version, publish-pos, publish-bakery, publish-android, publish-crates, publish-docker]
    if: needs.release-management.outputs.published == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download Android Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-builds
          path: android-release-builds
          continue-on-error: true

      - name: Create Git Tag and Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ needs.set-version.outputs.version }}
          IS_PRERELEASE: ${{ needs.release-management.outputs.isPrerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Checking if git tag $TAG_NAME exists locally/remotely..."
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME"
          fi

          echo "Publishing release $TAG_NAME..."
          if gh release edit "$TAG_NAME" --draft=false; then
            echo "Draft release $TAG_NAME successfully published."
          else
            echo "Draft release $TAG_NAME not found or couldn't be undrafted, creating new release..."
            PRERELEASE_FLAG=""
            if [ "$IS_PRERELEASE" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Release $TAG_NAME" $PRERELEASE_FLAG || true
          fi

          APK_PATH=$(find android-release-builds -name "*.apk" 2>/dev/null | head -n 1)
          AAB_PATH=$(find android-release-builds -name "*.aab" 2>/dev/null | head -n 1)

          if [ -n "$APK_PATH" ]; then
            echo "Uploading Android APK $APK_PATH to release $TAG_NAME..."
            gh release upload "$TAG_NAME" "$APK_PATH#scryme-android-${TAG_NAME}.apk" --clobber || true
          fi
          if [ -n "$AAB_PATH" ]; then
            echo "Uploading Android AAB $AAB_PATH to release $TAG_NAME..."
            gh release upload "$TAG_NAME" "$AAB_PATH#scryme-android-${TAG_NAME}.aab" --clobber || true
          fi
