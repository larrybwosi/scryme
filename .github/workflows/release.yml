name: Release and Publish

on:
  push:
    branches:
      - main
      - nextgen

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-management:
    name: Release Management
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
      isPrerelease: ${{ steps.branch-check.outputs.isPrerelease }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Determine Release Type
        id: branch-check
        run: |
          if [ "${{ github.ref_name }}" = "nextgen" ]; then
            echo "isPrerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "isPrerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enter Prerelease Mode
        if: steps.branch-check.outputs.isPrerelease == 'true'
        run: |
          if [ ! -f .changeset/pre.json ]; then
            npx changeset pre enter next
          fi

      - name: Exit Prerelease Mode (safety net for main)
        if: steps.branch-check.outputs.isPrerelease == 'false'
        run: |
          if [ -f .changeset/pre.json ]; then
            npx changeset pre exit
          fi

      - name: Check for Pending Changesets
        id: check-changesets
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "hasChangesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasChangesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Directly Version Prerelease on Nextgen
        if: steps.branch-check.outputs.isPrerelease == 'true' && steps.check-changesets.outputs.hasChangesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm version-packages
          git add .
          git commit -m "chore(release): version prerelease packages"
          git push origin nextgen

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: release-management
    if: needs.release-management.outputs.published == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Packages
        run: pnpm turbo build --filter="./packages/*"

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-packages
          path: packages/

  set-version:
    name: Set Version Output
    runs-on: ubuntu-latest
    needs: release-management
    if: needs.release-management.outputs.published == 'true'
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./apps/pos/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish-pos:
    name: Publish POS (${{ matrix.os }} - ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    needs: [release-management, set-version, build-packages]
    if: needs.release-management.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        variant: [pharmacy, retail, standalone, supermarket, restaurant]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: built-packages
          path: packages

      - name: Set OS specific args
        id: target
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "args=--target x86_64-pc-windows-msvc" >> $GITHUB_OUTPUT
          else
            echo "args=--target x86_64-unknown-linux-gnu" >> $GITHUB_OUTPUT
          fi

      - name: Build and Publish POS App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'secret' }}
          VITE_BUSINESS_MODE: ${{ matrix.variant }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.VITE_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN || secrets.NEXT_PUBLIC_SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY || secrets.NEXT_PUBLIC_POSTHOG_KEY || secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY || secrets.POSTHOG_API_KEY || secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST || secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          OPENPANEL_CLIENT_ID: ${{ secrets.OPENPANEL_CLIENT_ID || secrets.NEXT_PUBLIC_OPENPANEL_CLIENT_ID || secrets.VITE_OPENPANEL_CLIENT_ID }}
          VITE_OPENPANEL_CLIENT_ID: ${{ secrets.VITE_OPENPANEL_CLIENT_ID || secrets.OPENPANEL_CLIENT_ID || secrets.NEXT_PUBLIC_OPENPANEL_CLIENT_ID }}
          VITE_OPENPANEL_HOST: ${{ secrets.VITE_OPENPANEL_HOST || secrets.NEXT_PUBLIC_OPENPANEL_HOST || secrets.OPENPANEL_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.POS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.POS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./apps/pos
          tagName: v${{ needs.set-version.outputs.version }}
          releaseName: "v${{ needs.set-version.outputs.version }}"
          releaseBody: "Release v${{ needs.set-version.outputs.version }}"
          releaseDraft: false
          prerelease: ${{ needs.release-management.outputs.isPrerelease }}
          args: ${{ steps.target.outputs.args }} --config src-tauri/tauri.${{ matrix.variant }}.conf.json --features ${{ matrix.variant }}

  publish-crates:
    name: Publish Rust SDK to Crates.io
    runs-on: ubuntu-latest
    needs: [release-management, build-packages]
    if: needs.release-management.outputs.published == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Java (Required for openapi-generator-cli)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: built-packages
          path: packages

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Rust SDK
        run: pnpm --filter @scryme/sdk generate:rust

      - name: Publish to Crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} ${{ needs.release-management.outputs.isPrerelease == 'true' && '--allow-dirty' || '' }}
        working-directory: packages/v3-sdk/rust

  publish-docker:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [release-management, set-version]
    if: needs.release-management.outputs.published == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          push: true
        env:
          VERSION: ${{ needs.set-version.outputs.version }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'secret' }}
