services:
  # --- DATABASE ---
  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dbuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dbpassword}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - scryme-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  customer-db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dbuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dbpassword}
      - POSTGRES_DB=${CUSTOMER_DB_NAME:-customer_db}
    volumes:
      - customer_postgres_data:/var/lib/postgresql/data
    networks:
      - scryme-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${CUSTOMER_DB_NAME:-customer_db} -q"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- CACHE ---
  redis:
    image: redis:alpine
    restart: always
    networks:
      - scryme-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # --- MESSAGE BROKER ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-adminpassword}
    networks:
      - scryme-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5672"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  admin:
    image: ghcr.io/larrybwosi/scryme/admin:${SCRYME_VERSION:-latest}
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://dbuser:dbpassword@db:5432/app_db?schema=public}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.scryme.tech}
      - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3007}
      - PORT=${ADMIN_PORT:-3007}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-betterauthsecret1234567890secret}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - scryme-network
      - proxy-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${ADMIN_PORT:-3007}/api/health",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- APPLICATIONS ---
  api:
    image: ghcr.io/larrybwosi/scryme/api:${SCRYME_VERSION:-latest}
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://dbuser:dbpassword@db:5432/app_db?schema=public}
      - CUSTOMER_DB=${CUSTOMER_DB:-postgresql://${POSTGRES_USER:-dbuser}:${POSTGRES_PASSWORD:-dbpassword}@customer-db:5432/${CUSTOMER_DB_NAME:-customer_db}?schema=public}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-adminpassword}@rabbitmq:5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-adminpassword}
      - PORT=${API_PORT:-4000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.scryme.tech}
      - REALTIME_PROVIDER=${REALTIME_PROVIDER:-socketio}
      - SOCKET_URL=${SOCKET_URL:-https://api.scryme.tech}
      - JWT_SECRET=${JWT_SECRET:-jwtsecret1234567890jwtsecret}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-betterauthsecret1234567890secret}
      - INTERNAL_ADMIN_SECRET=${INTERNAL_ADMIN_SECRET:-adminsecret1234567890secret}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-encryptionkey1234567890key12345}
    depends_on:
      db:
        condition: service_healthy
      customer-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - scryme-network
      - proxy-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--timeout=3",
          "--spider",
          "http://localhost:${API_PORT:-4000}/api/v2/health",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    image: ghcr.io/larrybwosi/scryme/web:${SCRYME_VERSION:-latest}
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://dbuser:dbpassword@db:5432/app_db?schema=public}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.scryme.tech}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://scryme.tech}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://scryme.tech}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-betterauthsecret1234567890secret}
      - NEXT_PUBLIC_REALTIME_PROVIDER=${NEXT_PUBLIC_REALTIME_PROVIDER:-socketio}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-https://api.scryme.tech}
      - PORT=${WEB_PORT:-3000}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - scryme-network
      - proxy-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--timeout=3",
          "--spider",
          "http://localhost:${WEB_PORT:-3000}/api/health",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  crm:
    image: ghcr.io/larrybwosi/scryme/crm:${SCRYME_VERSION:-latest}
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://dbuser:dbpassword@db:5432/app_db?schema=public}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.scryme.tech}
      - NEXT_PUBLIC_REALTIME_PROVIDER=${NEXT_PUBLIC_REALTIME_PROVIDER:-socketio}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-https://api.scryme.tech}
      - PORT=${CRM_PORT:-3001}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-betterauthsecret1234567890secret}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - scryme-network
      - proxy-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--timeout=3",
          "--spider",
          "http://localhost:${CRM_PORT:-3001}/api/health",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  customer_postgres_data:
  rustfs_data:
  loki_data:

networks:
  scryme-network:
    driver: bridge
  proxy-network:
    name: ${PROXY_NETWORK_NAME:-dokploy-network}
    external: true
