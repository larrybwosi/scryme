services:
  prisma-studio:
    build:
      context: ../..
      dockerfile: docker/studio/Dockerfile
    image: ghcr.io/larrybwosi/scryme/prisma-studio:${SCRYME_VERSION:-latest}
    container_name: scryme-prisma-studio
    restart: always
    ports:
      - "${STUDIO_PORT:-5555}:5555"
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - path: .env
        required: false
      - path: ../../.env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://dbuser:dbpassword@db:5432/app_db?schema=public}
      - PORT=${STUDIO_PORT:-5555}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${STUDIO_PORT:-5555}",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - scryme-network
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK:-dokploy-network}"
      - "traefik.http.routers.prisma-studio.rule=Host(`${STUDIO_DOMAIN:-studio.scryme.tech}`)"
      - "traefik.http.routers.prisma-studio.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.prisma-studio.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.prisma-studio.middlewares=prisma-studio-auth"
      - "traefik.http.middlewares.prisma-studio-auth.basicauth.users=${STUDIO_BASIC_AUTH:-admin:$$apr1$$q89T1P18$$x/T5pD63lH698305.8123.}"
      - "traefik.http.services.prisma-studio.loadbalancer.server.port=${STUDIO_PORT:-5555}"
      - "logging_job=prisma-studio"

networks:
  scryme-network:
    name: ${SCRYME_NETWORK_NAME:-scryme-network}
    external: true
  proxy-network:
    name: ${PROXY_NETWORK_NAME:-dokploy-network}
    external: true
