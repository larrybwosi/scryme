services:
  crm:
    image: ghcr.io/larrybwosi/scryme/crm:${SCRYME_VERSION:-latest}
    container_name: scryme-crm
    restart: always
    ports:
      - "${CRM_PORT:-3001}:3001"
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - path: .env
        required: false
      - path: ../../.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=${CRM_PORT:-3001}
      - DATABASE_URL=${DATABASE_URL:-postgresql://dbuser:dbpassword@db:5432/app_db?schema=public}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.scryme.tech}
      - NEXT_PUBLIC_REALTIME_PROVIDER=${NEXT_PUBLIC_REALTIME_PROVIDER:-socketio}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-https://api.scryme.tech}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-betterauthsecret1234567890secret}
    networks:
      - scryme-network
      - proxy-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--timeout=3",
          "--spider",
          "http://localhost:${CRM_PORT:-3001}/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  scryme-network:
    name: scryme-network
    external: true
  proxy-network:
    name: ${PROXY_NETWORK_NAME:-dokploy-network}
    external: true
