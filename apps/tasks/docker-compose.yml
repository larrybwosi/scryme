services:
  tasks:
    image: ghcr.io/larrybwosi/scryme/tasks:${SCRYME_VERSION:-latest}
    container_name: scryme-tasks
    restart: always
    ports:
      - "${TASKS_PORT:-3009}:3009"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:' + (process.env.PORT || 3009) + '/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    environment:
      - PORT=${TASKS_PORT:-3009}
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-https://api.scryme.tech}
