services:
  # --- DATABASE ---
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbpassword}
      POSTGRES_DB: ${POSTGRES_DB:-tasks_db}
    ports:
      - "5432:5432"
    volumes:
      - tasks_postgres_data:/var/lib/postgresql/data
    networks:
      - tasks-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- DATABASE MIGRATIONS ---
  db-migrate:
    image: ghcr.io/larrybwosi/scryme/api:${SCRYME_VERSION:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dbuser}:${POSTGRES_PASSWORD:-dbpassword}@db:5432/${POSTGRES_DB:-tasks_db}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tasks-network
    command: ["pnpm", "--filter", "@repo/db", "db:migrate:deploy"]

  # --- TASK APP FRONTEND / SERVICE ---
  tasks:
    image: ghcr.io/larrybwosi/scryme/tasks:${SCRYME_VERSION:-latest}
    restart: always
    ports:
      - "${PORT:-3009}:${PORT:-3009}"
    environment:
      PORT: ${PORT:-3009}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - tasks-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${PORT:-3009}/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  tasks_postgres_data:

networks:
  tasks-network:
    driver: bridge
