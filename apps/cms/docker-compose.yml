services:
  cms:
    image: ghcr.io/larrybwosi/scryme/cms:${SCRYME_VERSION:-latest}
    container_name: scryme-cms
    restart: always
    ports:
      - "${CMS_PORT:-3010}:3010"
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - path: .env
        required: false
      - path: ../../.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=${CMS_PORT:-3010}
      - DATABASE_URL=${DATABASE_URL:-postgresql://dbuser:dbpassword@db:5432/app_db?schema=public}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-payloadsecret1234567890secret32ch}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_CMS_URL:-http://localhost:3010}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-http://rustfs:9000}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-your-access-key}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-your-secret-key}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-dealio-uploads}
    networks:
      - scryme-network
      - proxy-network

networks:
  scryme-network:
    name: scryme-network
    external: true
  proxy-network:
    name: ${PROXY_NETWORK_NAME:-dokploy-network}
    external: true
