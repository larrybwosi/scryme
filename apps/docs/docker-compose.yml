services:
  docs:
    image: ghcr.io/larrybwosi/scryme/docs:${SCRYME_VERSION:-latest}
    container_name: scryme-docs
    restart: always
    ports:
      - "${DOCS_PORT:-3005}:3005"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:' + (process.env.PORT || 3005) + '/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    environment:
      - PORT=${DOCS_PORT:-3005}
      - NODE_ENV=production
