services:
  site-next:
    build:
      context: ../../
      dockerfile: apps/site-next/Dockerfile
      args:
        VITE_SANITY_PROJECT_ID: ${VITE_SANITY_PROJECT_ID}
        VITE_SANITY_DATASET: ${VITE_SANITY_DATASET:-production}
        VITE_API_URL: ${VITE_API_URL:-https://api.scryme.tech}
        VITE_WEB_URL: ${VITE_WEB_URL:-https://app.scryme.tech}
        VITE_POSTHOG_PROJECT_TOKEN: ${VITE_POSTHOG_PROJECT_TOKEN}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://eu.i.posthog.com}
    container_name: scryme-site-next
    restart: always
    ports:
      - "${SITE_NEXT_PORT:-3006}:3006"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:' + (process.env.PORT || 3006) + '/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    environment:
      - PORT=${SITE_NEXT_PORT:-3006}
      - NODE_ENV=production
      - VITE_SANITY_PROJECT_ID=${VITE_SANITY_PROJECT_ID}
      - VITE_SANITY_DATASET=${VITE_SANITY_DATASET:-production}
      - SANITY_STUDIO_PROJECT_ID=${SANITY_STUDIO_PROJECT_ID:-${VITE_SANITY_PROJECT_ID}}
      - SANITY_STUDIO_DATASET=${SANITY_STUDIO_DATASET:-${VITE_SANITY_DATASET:-production}}
      - SANITY_API_TOKEN=${SANITY_API_TOKEN}
      - VITE_API_URL=${VITE_API_URL:-https://api.scryme.tech}
      - VITE_WEB_URL=${VITE_WEB_URL:-https://app.scryme.tech}
      - VITE_POSTHOG_PROJECT_TOKEN=${VITE_POSTHOG_PROJECT_TOKEN}
      - VITE_POSTHOG_HOST=${VITE_POSTHOG_HOST:-https://eu.i.posthog.com}
